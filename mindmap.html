<!DOCTYPE html>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #c5a059, #d9bc80);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .logo-text { font-size: 1rem; font-weight: 600; color: #f0ead8; }
    .logo-sub  { font-size: 0.72rem; color: #888; margin-top: 1px; }

    .legend {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.75rem; color: #aaa;
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }

    #mindmap-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .markmap {
      width: 100%;
      height: 100%;
    }

    footer {
      padding: 8px 28px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      font-size: 0.7rem;
      color: #555;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
